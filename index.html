<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoFácil</title>

<style>
:root {
  --fondo: #0b1020;
  --panel: #151d32;
  --borde: #293653;
  --texto: #f3f6ff;
  --suave: #aebbd4;
  --verde: #38e59b;
  --azul: #63a7ff;
  --rojo: #ff7777;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: var(--fondo);
  color: var(--texto);
  font-family: Arial, sans-serif;
}

.contenedor {
  max-width: 720px;
  margin: auto;
}

header {
  text-align: center;
  padding: 15px 0 20px;
}

.logo {
  font-size: 42px;
}

h1 {
  margin: 8px 0;
  font-size: 30px;
}

header p {
  color: var(--suave);
  line-height: 1.5;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--borde);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 15px;
}

h2 {
  font-size: 19px;
  margin-top: 0;
}

label {
  display: block;
  margin: 14px 0 7px;
  color: var(--suave);
  font-size: 14px;
}
